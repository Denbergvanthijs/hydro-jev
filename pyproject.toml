[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "BLE001",
    "COM812",
    "CPY001",
    "EM101",
    "EM102",
    "ISC001",
    "TRY003",
    "TRY400",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "ARG", "D", "INP001", "PLR2004", "S101", "S106"]
"main.py" = ["T201"]
